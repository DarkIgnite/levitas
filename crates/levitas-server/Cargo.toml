[package]
name = "levitas-server"
description = "The Levitas server binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "levitas"
path = "src/main.rs"

[dependencies]
levitas-protocol.workspace = true
levitas-registry.workspace = true
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
