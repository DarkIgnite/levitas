name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The game data is generated from Mojang's server.jar and never kept in git
      # (docs/CLEAN_ROOM.md); it only changes with the data generator script.
      - uses: actions/cache@v4
        with:
          path: generated
          key: generated-${{ hashFiles('tools/datagen.py') }}

      - name: Generate game data
        run: |
          if [ ! -f generated/26.3/reports/registries.json ]; then
            python tools/datagen.py
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
