[package]
name = "levitas-registry"
description = "Block, item and registry data generated from the data-generator reports"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
serde_json = "1.0.154"
# Pumpkin (GPL-3.0, https://github.com/Pumpkin-MC/Pumpkin): hardness, light and collision
# shapes of the blocks minecraft-data has no rows for yet. Same revision as levitas-pumpkin.
pumpkin-data = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "cd9e98c966919541fe951d78dfdf8d3401e10112" }
